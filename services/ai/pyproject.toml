[project]
name = "trustdesk-ai"
version = "0.1.0"
description = "TrustDesk AI service: ingestion, hybrid retrieval, verified RAG answers"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "tiktoken>=0.7",
  "langdetect>=1.0.9",
  "jsonschema>=4.23",
  "python-multipart>=0.0.9",
  "openai>=1.40",
  "anthropic>=0.34",
  "cryptography>=43",
  "typer>=0.12",
]

[project.optional-dependencies]
# Local profile models (large: pulls torch). Ollama can serve embeddings without this.
local = ["sentence-transformers>=3.0"]
# Embedded local PostgreSQL 16 + pgvector (no Docker / cloud needed).
localdb = ["pgserver>=0.1.4"]
crawl = ["crawl4ai>=0.4"]
observability = ["langfuse>=2.50"]
s3 = ["boto3>=1.35"]
redis = ["redis>=5.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "respx>=0.21"]

[project.scripts]
trustdesk = "trustdesk_ai.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustdesk_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs DATABASE_URL pointing at Postgres with pgvector"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S104", "S105", "S106"]
# Local process launcher: runs fixed, non-user-supplied commands.
"src/trustdesk_ai/cli/up.py" = ["S603", "S607", "S310"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langdetect.*", "lxml.*", "sentence_transformers.*", "pgserver.*"]
follow_imports = "skip"
ignore_missing_imports = true
